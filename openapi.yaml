        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      operationId: geo.places.delete
      summary: Delete a place
      tags: [places]
      x-required-role: write
      parameters:
        - $ref: '#/components/parameters/CollectionName'
        - $ref: '#/components/parameters/PlaceId'
      responses:
        '204':
          description: Deleted.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The collection does not exist, or it exists but has no place with this id.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                collectionNotFound:
                  value: { error: { code: COLLECTION_NOT_FOUND, message: 'collection "stores" not found' } }
                placeNotFound:
                  value: { error: { code: PLACE_NOT_FOUND, message: 'place "hq" not found in "stores"' } }
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/collections/{name}/nearby:
    get:
      operationId: geo.places.nearby
      summary: Places near a point, nearest first
      description: >-
        `radius` (km) defaults to `min(50, MAX_RADIUS_KM)` and must be between 0 (exclusive) and
        `MAX_RADIUS_KM` (env-configurable, default 500); out of range fails with 400
        INVALID_COORDINATES — the same code used for an invalid `lat`/`lng`
        (`GeoError.STATUS.INVALID_COORDINATES` is genuinely overloaded across both triggers). Extra
        query parameters of the form `filter.<key>=<value>` (not individually listed below — the
        key name is caller-defined) restrict results to places whose `attrs[<key>]` string-equals
        `<value>`; every other query key must be one of the ones listed.
      tags: [places]
      x-required-role: read
      parameters:
        - $ref: '#/components/parameters/CollectionName'
        - name: lat
          in: query
          required: true
          schema: { type: string, pattern: '^-?\d{1,3}(\.\d+)?$' }
        - name: lng
          in: query
          required: true
          schema: { type: string, pattern: '^-?\d{1,3}(\.\d+)?$' }
        - name: radius
          in: query
          schema: { type: string, pattern: '^\d{1,5}(\.\d+)?$' }
          description: Kilometers. Default min(50, MAX_RADIUS_KM).
        - name: limit
          in: query
          schema: { type: string, pattern: '^([1-9]|[1-9][0-9]|100)$' }
          description: Default 10, clamped to [1,100].
      responses:
        '200':
          description: Places within `radiusKm` of the point, nearest first.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [from, radiusKm, total, items]
                properties:
                  from: { $ref: '#/components/schemas/Point' }
                  radiusKm: { type: number }
                  total: { type: integer, minimum: 0, description: Matches found within the radius, before `limit` is applied. }
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NearbyPlace'
        '400':
          $ref: '#/components/responses/InvalidCoordinates'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/stats:
    get:
      operationId: geo.stats.get
      summary: Aggregate service statistics
      tags: [stats]
      x-required-role: read
      responses:
        '200':
          description: Database status plus collection/place totals.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [database, countries, collections, places, dbBytes, items]
                properties:
                  database:
                    $ref: '#/components/schemas/DatabaseInfo'
                  countries: { type: integer, description: Size of the bundled reference table (fixed, not affected by the IP database). }
                  collections: { type: integer, minimum: 0 }
                  places: { type: integer, minimum: 0, description: Places across every collection. }
                  dbBytes: { type: integer, minimum: 0, description: Size of the SQLite store backing collections/places. }
                  items:
                    type: array
                    description: One entry per collection.
                    items:
                      type: object
                      required: [name, places, updatedAt]
                      properties:
                        name: { type: string }
                        places: { type: integer, minimum: 0 }
                        updatedAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

components:
  securitySchemes:
    ApiKey:
      type: http
      scheme: bearer
      description: >-
        `Authorization: Bearer <secret>`. Keys come from `GEO_API_KEYS`
        (`id:secret[:role]`, role one of `read`/`write`/`readwrite`, default `readwrite`), compared
        in constant time across every configured key (no early exit). Every operation below
        declares its required role via the `x-required-role` extension (`read` or `write`;
        `readwrite` always satisfies either). Required on every `/v1/*` route and on `/metrics`;
        `/health`, `/ready` and `/v1/info` are unauthenticated.
  parameters:
    Lang:
      name: lang
      in: query
      schema:
        type: string
        minLength: 2
        maxLength: 35
        pattern: '^[A-Za-z0-9-]+$'
      description: >-
        BCP 47 language tag for localized names. Invalid or unrecognized tags never error — they
        silently fall back to DEFAULT_LANG (env-configurable, default "en").
    CollectionName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: '^[a-z0-9]+([.\-_][a-z0-9]+)*$'
        maxLength: 80
    PlaceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    IpLookupOk:
      description: "The lookup result. `found: false` for a special-range address or a public address not covered by the database."
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IpLookupResult'
    DatabaseInfoOk:
      description: Current IP database status.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DatabaseInfo'
    PhoneNormalizeOk:
      description: "The normalization result. `valid: false` for an unresolvable calling code or a missing country on a national-format number — not an error."
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneResult'
    Unauthorized:
      description: Missing or invalid API key.
      headers:
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: UNAUTHORIZED, message: missing or invalid API key }
    Forbidden:
      description: The API key does not have the role this route requires.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: FORBIDDEN, message: this API key has no write access }
    RateLimited:
      description: Per-API-key rate limit exceeded (RATE_LIMIT_MAX per minute, default 3000). Applies to every `/v1/*` route; NOT enforced on `/metrics`.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: RATE_LIMITED, message: 'rate limit exceeded, retry in 42 seconds' }
    ValidationFailed:
      description: Request failed JSON Schema validation (missing/extra/malformed field).
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: VALIDATION_FAILED, message: "body/ips must NOT have more than 1000 items", details: [{ path: /ips, message: must NOT have more than 1000 items, params: { limit: 1000 } }] }
    InvalidIp:
      description: The value is not a parseable IPv4 or IPv6 address.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: INVALID_IP, message: '"not-an-ip" is not an IP address' }
    InvalidCoordinates:
      description: >-
        `lat`/`lng` out of range or unparseable, OR (on `/nearby` only) `radius` out of range —
        both use the same INVALID_COORDINATES code.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: INVALID_COORDINATES, message: lat must be between -90 and 90 }
    InvalidPhone:
      description: The number is empty, or contains characters other than digits/spaces/parentheses/dots/dashes.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: INVALID_PHONE, message: number is empty }
    BatchTooLarge:
      description: More than MAX_BATCH items in this batch call (see the route description for the two-layer cap).
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: BATCH_TOO_LARGE, message: at most 100 items per batch }
    CountryNotFound:
      description: No country matches this code.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: COUNTRY_NOT_FOUND, message: 'country "zz" not found' }
    CurrencyNotFound:
      description: The code is not used by any country in the reference table.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: CURRENCY_NOT_FOUND, message: 'currency "zzz" is not used by any country' }
    TimezoneNotFound:
      description: The name does not resolve to a known IANA time zone.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: TIMEZONE_NOT_FOUND, message: 'time zone "Not/AZone" not found' }
    CollectionNotFound:
      description: No collection with this name exists.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: COLLECTION_NOT_FOUND, message: 'collection "stores" not found' }
    CollectionExists:
      description: A collection with this name already exists.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: COLLECTION_EXISTS, message: 'collection "stores" already exists' }
    DatabaseUnavailable:
      description: No IP city database is configured, or the configured one failed to load. Only reachable for a public address; special-range addresses never trigger this.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: DATABASE_UNAVAILABLE, message: 'no IP database configured (MMDB_PATH)' }
    DatabaseReloadFailed:
      description: The reload attempt failed checksum verification, opening or validation; the previously loaded database (if any) is untouched and still serving.
      headers:
        X-Content-Type-Options:
          $ref: '#/components/headers/XContentTypeOptions'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: DATABASE_RELOAD_FAILED, message: 'IP database failed to reload: city database checksum mismatch for ./data/city.mmdb: expected ..., got ...' }
  headers:
    XContentTypeOptions:
      description: Set on every response by geo's onSend hook.
      schema:
        type: string
        const: nosniff
    CacheControl:
      description: Set on every response by geo's onSend hook.
      schema:
        type: string
        const: no-store
    WWWAuthenticate:
      description: Present on 401 responses.
      schema:
        type: string
        const: Bearer
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              anyOf:
                - type: object
                - type: array
    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        error:
          type: string
          description: Present only when status is "unavailable".
    InfoResponse:
      type: object
      required: [service, version, apiVersion, capabilities, schemaVersion, serviceCore]
      properties:
        service:
          type: string
          const: geo
        version:
          type: string
          description: geo's own package.json version.
        apiVersion:
          type: string
          const: v1
        capabilities:
          type: array
          items: { type: string }
          example: [ip-lookup, phone-normalize, distance, place-search, manual-reload]
        schemaVersion:
          type: integer
          description: geo's SQLite schema version (PRAGMA user_version).
        serviceCore:
          type: string
          description: Version of the @atc-web/service-core package actually running.

    Point:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    IpCountry:
      type: object
      required: [code, name, eu, callingCodes, currency]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2. }
        name: { type: string }
        eu: { type: boolean }
        callingCodes:
          type: array
          items: { type: string }
          example: ["+90"]
        currency: { type: ["string", "null"] }
    IpLookupResult:
      type: object
      required: [ip, version, kind, found, network, country, registeredCountry, continent, region, city, postal, location, timezone, asn, source]
      properties:
        ip: { type: string }
        version: { type: integer, enum: [4, 6] }
        kind:
          type: string
          enum: [public, private, loopback, link-local, multicast, reserved, unspecified]
        found:
          type: boolean
          description: False for a special-range address, or a public address not covered by the loaded database.
        network: { type: ["string", "null"], description: CIDR of the matched record, e.g. "1.1.1.0/24". }
        country:
          anyOf:
            - $ref: '#/components/schemas/IpCountry'
            - type: "null"
        registeredCountry:
          anyOf:
            - $ref: '#/components/schemas/IpCountry'
            - type: "null"
        continent:
          anyOf:
            - type: object
              required: [code, name]
              properties:
                code: { type: ["string", "null"] }
                name: { type: ["string", "null"] }
            - type: "null"
        region:
          anyOf:
            - type: object
              required: [code, name]
              properties:
                code: { type: ["string", "null"] }
                name: { type: ["string", "null"] }
            - type: "null"
        city:
          anyOf:
            - type: object
              required: [name]
              properties:
                name: { type: string }
            - type: "null"
        postal: { type: ["string", "null"] }
        location:
          anyOf:
            - type: object
              required: [lat, lng, accuracyKm]
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracyKm: { type: ["number", "null"] }
            - type: "null"
        timezone: { type: ["string", "null"], description: IANA zone name. }
        asn:
          anyOf:
            - type: object
              required: [number, organization, network]
              properties:
                number: { type: ["integer", "null"] }
                organization: { type: ["string", "null"] }
                network: { type: string, description: CIDR of the matched ASN record. }
            - type: "null"
          description: Present only when ASN_MMDB_PATH is configured and covers this address.
        source: { type: ["string", "null"], description: database_type of the loaded city database, e.g. "GeoLite2-City". Null when not found or no database configured. }
    IpBatchRequest:
      type: object
      additionalProperties: false
      required: [ips]
      properties:
        ips:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 2, maxLength: 64 }
        lang:
          type: string
          minLength: 2
          maxLength: 35
          pattern: '^[A-Za-z0-9-]+$'
    IpBatchItem:
      type: object
      required: [ip, ok]
      properties:
        ip: { type: string }
        ok: { type: boolean }
        result:
          $ref: '#/components/schemas/IpLookupResult'
          description: Present when ok is true.
        error:
          type: object
          description: Present when ok is false.
          required: [code, message]
          properties:
            code: { type: string, enum: [INVALID_IP, DATABASE_UNAVAILABLE] }
            message: { type: string }
    IpBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/IpBatchItem'

    MmdbInfo:
      type: object
      required: [type, buildEpoch, builtAt, ipVersion, nodeCount, recordSize, languages, description, path, sizeBytes, modifiedAt]
      properties:
        type: { type: string, example: GeoLite2-City }
        buildEpoch: { type: integer }
        builtAt: { type: string, format: date-time }
        ipVersion: { type: integer, enum: [4, 6] }
        nodeCount: { type: integer }
        recordSize: { type: integer, enum: [24, 28, 32] }
        languages:
          type: array
          items: { type: string }
        description:
          type: object
          description: Language-tag-keyed description strings from the MMDB metadata block.
        path: { type: ["string", "null"] }
        sizeBytes: { type: integer }
        modifiedAt: { type: ["string", "null"], format: date-time }
    DatabaseInfo:
      type: object
      required: [configured, loaded, error, loadedAt, city, asn, lookups]
      properties:
        configured: { type: boolean, description: Whether MMDB_PATH is set. }
        loaded: { type: boolean }
        error: { type: ["string", "null"], description: Message from the last failed load/reload attempt. }
        loadedAt: { type: ["string", "null"], format: date-time }
        city:
          anyOf:
            - $ref: '#/components/schemas/MmdbInfo'
            - type: "null"
        asn:
          anyOf:
            - $ref: '#/components/schemas/MmdbInfo'
            - type: "null"
        lookups:
          type: object
          required: [hit, miss, special]
          properties:
            hit: { type: integer, minimum: 0 }
            miss: { type: integer, minimum: 0 }
            special: { type: integer, minimum: 0 }

    CountryView:
      type: object
      required: [code, alpha3, numeric, name, continent, eu, callingCodes, currency, timezones, flag]
      properties:
        code: { type: string, description: ISO 3166-1 alpha-2. }
        alpha3: { type: string }
        numeric: { type: string }
        name: { type: string, description: Localized via lang. }
        continent:
          type: object
          required: [code, name]
          properties:
            code: { type: string, enum: [AF, AN, AS, EU, NA, OC, SA] }
            name: { type: string }
        eu: { type: boolean }
        callingCodes:
          type: array
          items: { type: string }
          example: ["+90"]
        currency:
          anyOf:
            - type: object
              required: [code, name]
              properties:
                code: { type: string }
                name: { type: string }
            - type: "null"
        timezones:
          type: array
          items: { type: string }
        flag: { type: string, description: Regional-indicator flag emoji. }

    CurrencyView:
      type: object
      required: [code, name, symbol, decimals, countries]
      properties:
        code: { type: string }
        name: { type: string, description: Localized via lang. }
        symbol: { type: string }
        decimals: { type: integer, minimum: 0 }
        countries:
          type: array
          items: { type: string }
          description: Alpha-2 codes of countries using this currency.

    TimezoneView:
      type: object
      required: [name, offset, offsetMinutes, abbreviation, longName, dst, observesDst, localTime, countries]
      properties:
        name: { type: string, description: Canonical IANA name. }
        offset: { type: string, example: "+03:00" }
        offsetMinutes: { type: integer }
        abbreviation: { type: string, example: "+03" }
        longName: { type: string, description: Localized via lang. }
        dst: { type: boolean, description: Currently observing DST. }
        observesDst: { type: boolean, description: Observes DST at some point in the current year, whether or not currently in it. }
        localTime: { type: string, description: 'Local wall-clock time at the evaluated instant, "YYYY-MM-DDTHH:mm:ss" (no offset/Z suffix).' }
        countries:
          type: array
          items: { type: string }
          description: Alpha-2 codes of countries using this zone.

    PhoneResult:
      type: object
      required: [input, e164, valid, reason, country, countries, callingCode, national]
      properties:
        input: { type: string }
        e164: { type: ["string", "null"] }
        valid: { type: boolean }
        reason: { type: ["string", "null"] }
        country: { type: ["string", "null"], description: Best-guess alpha-2; first of countries. }
        countries:
          type: array
          items: { type: string }
          description: Every country sharing the resolved calling code, best match first.
        callingCode: { type: ["string", "null"], example: "+90" }
        national: { type: string }
    PhoneBatchRequest:
      type: object
      additionalProperties: false
      required: [numbers]
      properties:
        numbers:
          type: array
          minItems: 1
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 40 }
        country:
          type: string
          minLength: 2
          maxLength: 3
    PhoneBatchItem:
      type: object
      required: [number, ok]
      properties:
        number: { type: string }
        ok: { type: boolean }
        result:
          $ref: '#/components/schemas/PhoneResult'
          description: Present when ok is true.
        error:
          type: object
          description: Present when ok is false.
          required: [code, message]
          properties:
            code: { type: string, enum: [INVALID_PHONE, COUNTRY_NOT_FOUND] }
            message: { type: string }
    PhoneBatchResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PhoneBatchItem'

    CollectionView:
      type: object
      required: [name, description, places, createdBy, createdAt, updatedAt]
      properties:
        name: { type: string }
        description: { type: string }
        places: { type: integer, minimum: 0 }
        createdBy: { type: string, description: API key id that created the collection. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PlaceInput:
      type: object
      additionalProperties: false
      required: [id, name, lat, lng]
      properties:
        id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        attrs:
          type: object
          maxProperties: 50
          description: Arbitrary caller-defined attributes; string values are matched by nearby's filter.<key> query parameters.
    PlaceView:
      type: object
      required: [id, name, lat, lng, attrs, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        lat: { type: number }
        lng: { type: number }
        attrs: { type: object }
        updatedAt: { type: string, format: date-time }
    NearbyPlace:
      allOf:
        - $ref: '#/components/schemas/PlaceView'
        - type: object
          required: [distanceKm, bearing]
          properties:
            distanceKm: { type: number, description: Rounded to 3 decimals. }
            bearing: { type: number, description: Initial bearing in degrees from north, clockwise, rounded to the nearest integer. }
