  /v1/collections/{name}/places:
    put:
      operationId: geo.places.upsert
      summary: Insert or replace places in a collection, all or nothing
      description: >-
        Atomic: either every place in the request is applied, or (on a duplicate `id` within the
        request, an empty name, invalid coordinates, or the collection's MAX_POINTS cap being
        exceeded) none of it is, and the whole call fails with 400 INVALID_PLACE or 413
        BATCH_TOO_LARGE. The MAX_POINTS cap (default 5000, env-configurable) limits the total
        number of places in one collection after the call, and is distinct from this route's own
        request-size ceiling (`maxItems: 100000` places per call).
      tags: [places]
      x-required-role: write
      parameters:
        - $ref: '#/components/parameters/CollectionName'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [places]
              properties:
                places:
                  type: array
                  minItems: 1
                  maxItems: 100000
                  items:
                    $ref: '#/components/schemas/PlaceInput'
      responses:
        '200':
          description: >-
            Counts for this call. `total` is the collection's place count after the call (places
            existing before the call, plus newly created ones — an updated place does not change
            the count).
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [created, updated, total]
                properties:
                  created: { type: integer, minimum: 0 }
                  updated: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
        '400':
          description: A schema validation failure, or an invalid place (duplicate id, empty name, or out-of-range coordinates) — see the shared ErrorEnvelope; `code` is `VALIDATION_FAILED` or `INVALID_PLACE`.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalidPlace:
                  value: { error: { code: INVALID_PLACE, message: 'place "hq": lat must be between -90 and 90', details: { index: 0 } } }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '413':
          $ref: '#/components/responses/BatchTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      operationId: geo.places.list
      summary: List places in a collection
      tags: [places]
      x-required-role: read
      parameters:
        - $ref: '#/components/parameters/CollectionName'
        - name: limit
          in: query
          schema: { type: string, pattern: '^([1-9]|[1-9][0-9]|[1-9][0-9][0-9]|1000)$' }
          description: Default 50.
        - name: offset
          in: query
          schema: { type: string, pattern: '^(0|[1-9][0-9]{0,6})$' }
          description: Default 0.
      responses:
        '200':
          description: A page of places.
          headers:
            X-Content-Type-Options:
              $ref: '#/components/headers/XContentTypeOptions'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required: [items, total, limit, offset]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlaceView'
                  total: { type: integer, minimum: 0, description: Total places in the collection, independent of paging. }
                  limit: { type: integer }
                  offset: { type: integer }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CollectionNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  /v1/collections/{name}/places/{id}:
    get:
      operationId: geo.places.get
      summary: Get a place by id
      tags: [places]
      x-required-role: read
